<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LL(a)M(e) - Universal AI Hub</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --user-msg: #312e81;
      --bot-msg: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

    /* Sidebar */
    #sidebar { width: 300px; background: #090d16; border-right: 1px solid var(--border-color); padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    .brand { font-size: 1.4rem; font-weight: bold; color: var(--accent); letter-spacing: 1px; }
    .config-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
    input, select { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 12px; border-radius: 6px; outline: none; width: 100%; }
    input:focus, select:focus { border-color: var(--accent); }

    /* Main Chat Area */
    #main { flex: 1; display: flex; flex-direction: column; height: 100vh; }
    #chat-history { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    .message { max-width: 80%; padding: 12px 16px; border-radius: 8px; line-height: 1.5; font-size: 0.95rem; white-space: pre-wrap; }
    .message.user { align-self: flex-end; background: var(--user-msg); border-bottom-right-radius: 2px; }
    .message.assistant { align-self: flex-start; background: var(--bot-msg); border: 1px solid var(--border-color); border-bottom-left-radius: 2px; }
    .meta-tag { font-size: 0.75rem; color: var(--accent); margin-bottom: 4px; font-weight: bold; }

    /* Input Bar */
    #input-container { padding: 15px 20px; background: #090d16; border-top: 1px solid var(--border-color); display: flex; gap: 10px; }
    textarea { flex: 1; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 10px; border-radius: 6px; resize: none; height: 50px; outline: none; }
    textarea:focus { border-color: var(--accent); }
    button { background: var(--accent); color: white; border: none; padding: 0 20px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

  <!-- Controls Sidebar -->
  <div id="sidebar">
    <div class="brand">LL(a)M(e) v1.0</div>
    
    <div class="config-group">
      <label>Gemini API Key</label>
      <input type="password" id="gemini-key" placeholder="AIzaSy..." onchange="saveKeys()">
    </div>
    
    <div class="config-group">
      <label>Grok / xAI API Key</label>
      <input type="password" id="grok-key" placeholder="xai-..." onchange="saveKeys()">
    </div>

    <hr style="border-color: var(--border-color);">

    <div class="config-group">
      <label>Model Agent</label>
      <select id="model-select">
        <option value="auto">Auto (Smart Route)</option>
        <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
        <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
        <option value="grok-beta">Grok Beta</option>
        <option value="grok-2-latest">Grok 2</option>
      </select>
    </div>

    <div class="config-group">
      <label>Effort / Thinking Mode</label>
      <select id="effort-select">
        <option value="low">Low (Fast Response)</option>
        <option value="medium" selected>Medium (Balanced)</option>
        <option value="high">High (Deep Reasoning)</option>
      </select>
    </div>

    <button onclick="clearChat()" style="margin-top: auto; background: #dc2626;">Clear Chat History</button>
  </div>

  <!-- Main Chat Screen -->
  <div id="main">
    <div id="chat-history"></div>
    <div id="input-container">
      <textarea id="prompt-input" placeholder="Type a prompt or code task... (Shift+Enter for newline)"></textarea>
      <button id="send-btn" onclick="handleSubmit()">Send</button>
    </div>
  </div>

  <script>
    // Unified chat history format: [{ role: 'user'|'assistant', text: string }]
    let conversationHistory = [];

    // Load API Keys from Local Storage
    window.onload = () => {
      document.getElementById('gemini-key').value = localStorage.getItem('llame_gemini_key') || '';
      document.getElementById('grok-key').value = localStorage.getItem('llame_grok_key') || '';
    };

    function saveKeys() {
      localStorage.setItem('llame_gemini_key', document.getElementById('gemini-key').value);
      localStorage.setItem('llame_grok_key', document.getElementById('grok-key').value);
    }

    function clearChat() {
      conversationHistory = [];
      document.getElementById('chat-history').innerHTML = '';
    }

    // Heuristic routing engine for "Auto" mode
    function routePrompt(prompt) {
      const p = prompt.toLowerCase();
      const codeKeywords = ['code', 'python', 'javascript', 'html', 'css', 'bug', 'function', 'class', 'algo', 'refactor', 'json'];
      const reasoningKeywords = ['logic', 'math', 'proof', 'solve', 'calculate', 'analyze', 'step by step', 'compare'];

      const containsCode = codeKeywords.some(kw => p.includes(kw));
      const containsReasoning = reasoningKeywords.some(kw => p.includes(kw));

      if (containsCode || containsReasoning || prompt.length > 400) {
        return 'gemini-2.5-pro'; // Complex task -> High capability model
      }
      return 'gemini-2.5-flash'; // Quick/casual task -> Fast model
    }

    function appendMessage(role, text, metadata = '') {
      const historyDiv = document.getElementById('chat-history');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${role}`;

      if (metadata) {
        const metaTag = document.createElement('div');
        metaTag.className = 'meta-tag';
        metaTag.innerText = metadata;
        msgDiv.appendChild(metaTag);
      }

      const textNode = document.createElement('div');
      textNode.innerText = text;
      msgDiv.appendChild(textNode);

      historyDiv.appendChild(msgDiv);
      historyDiv.scrollTop = historyDiv.scrollHeight;
    }

    async function handleSubmit() {
      const inputEl = document.getElementById('prompt-input');
      const sendBtn = document.getElementById('send-btn');
      const userPrompt = inputEl.value.trim();

      if (!userPrompt) return;

      const selectedModelSetting = document.getElementById('model-select').value;
      const effortMode = document.getElementById('effort-select').value;

      // Determine active target model
      let targetModel = selectedModelSetting;
      if (selectedModelSetting === 'auto') {
        targetModel = routePrompt(userPrompt);
      }

      // Add user prompt to history
      conversationHistory.push({ role: 'user', text: userPrompt });
      appendMessage('user', userPrompt);
      inputEl.value = '';
      sendBtn.disabled = true;

      try {
        let responseText = '';
        if (targetModel.startsWith('gemini')) {
          responseText = await fetchGemini(targetModel, effortMode);
        } else if (targetModel.startsWith('grok')) {
          responseText = await fetchGrok(targetModel, effortMode);
        }

        conversationHistory.push({ role: 'assistant', text: responseText });
        appendMessage('assistant', responseText, `Agent: ${targetModel} | Effort: ${effortMode}`);
      } catch (err) {
        appendMessage('assistant', `Error: ${err.message}`, 'System');
      } finally {
        sendBtn.disabled = false;
      }
    }

    // Helper to calculate temperature/system instructions based on Effort level
    function getEffortParameters(effort) {
      let temp = 0.7;
      let systemPrompt = '';

      if (effort === 'low') {
        temp = 0.2;
        systemPrompt = 'Be extremely concise, brief, and direct in your answer.';
      } else if (effort === 'medium') {
        temp = 0.7;
        systemPrompt = 'Provide a balanced, clear, and complete answer.';
      } else if (effort === 'high') {
        temp = 1.0;
        systemPrompt = 'Think through the response deeply and thoroughly. Provide extensive details, step-by-step reasoning, and edge-case analysis.';
      }
      return { temp, systemPrompt };
    }

    // Adapt unified history to Gemini API payload format
    async function fetchGemini(model, effort) {
      const apiKey = localStorage.getItem('llame_gemini_key');
      if (!apiKey) throw new Error('Gemini API key is missing.');

      const { temp, systemPrompt } = getEffortParameters(effort);

      const contents = conversationHistory.map(msg => ({
        role: msg.role === 'user' ? 'user' : 'model',
        parts: [{ text: msg.text }]
      }));

      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;

      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: systemPrompt }] },
          contents: contents,
          generationConfig: { temperature: temp }
        })
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.error?.message || 'Gemini API Error');
      return data.candidates[0].content.parts[0].text;
    }

    // Adapt unified history to OpenAI/xAI Grok API payload format
    async function fetchGrok(model, effort) {
      const apiKey = localStorage.getItem('llame_grok_key');
      if (!apiKey) throw new Error('Grok API key is missing.');

      const { temp, systemPrompt } = getEffortParameters(effort);

      const messages = [
        { role: 'system', content: systemPrompt },
        ...conversationHistory.map(msg => ({
          role: msg.role === 'user' ? 'user' : 'assistant',
          content: msg.text
        }))
      ];

      const res = await fetch('https://api.x.ai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${apiKey}`
        },
        body: JSON.stringify({
          model: model,
          messages: messages,
          temperature: temp
        })
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.error?.message || 'Grok API Error');
      return data.choices[0].message.content;
    }

    // Keyboard shortcut (Enter to send, Shift+Enter for newline)
    document.getElementById('prompt-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSubmit();
      }
    });
  </script>
</body>
</html>
